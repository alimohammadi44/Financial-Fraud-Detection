data:
  dir: data/raw/elliptic
  # Paper: steps 1-34 for training/model selection, 35-49 test.
  # Validation subdivision is not reported. We use a 5-timestep validation
  # block (30-34) as an explicit reproduction assumption.
  train_max_time: 29
  val_max_time: 34
  test_max_time: 49
  local_feature_dim: 94

model:
  hidden_dim: 64
  num_layers: 2
  dropout: 0.5
  # NOT reported in the paper; explicit reproduction assumption.
  gate_hidden_dim: 64

training:
  epochs: 500
  lr: 0.001
  weight_decay: 0.0
  focal_gamma: 2.0
  alpha_licit: 0.70
  alpha_illicit: 0.29
  seed: 42
  checkpoint_metric: illicit_f1

device: cuda
output_dir: outputs/fg_egcn_paper

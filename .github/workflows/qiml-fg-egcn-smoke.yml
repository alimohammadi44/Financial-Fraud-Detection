name: QIML FG-EGCN smoke

on:
  pull_request:
    paths:
      - 'qiml2026_fg_egcn/**'
      - '.github/workflows/qiml-fg-egcn-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy pandas scikit-learn PyYAML pytest
      - name: Compile package
        run: python -m compileall -q qiml2026_fg_egcn/src
      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}/qiml2026_fg_egcn/src
        run: pytest -q qiml2026_fg_egcn/tests

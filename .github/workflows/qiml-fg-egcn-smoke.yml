name: QIML FG-EGCN reproduction

on:
  push:
    branches:
      - qiml2026-fg-egcn-reproduction
    paths:
      - 'qiml2026_fg_egcn/**'
      - '.github/workflows/qiml-fg-egcn-smoke.yml'
  pull_request:
    paths:
      - 'qiml2026_fg_egcn/**'
      - '.github/workflows/qiml-fg-egcn-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy pandas scikit-learn PyYAML pytest
      - name: Compile package
        run: python -m compileall -q qiml2026_fg_egcn/src
      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}/qiml2026_fg_egcn/src
        run: pytest -q qiml2026_fg_egcn/tests

  reproduce:
    if: github.event_name != 'pull_request'
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      PYTHONPATH: ${{ github.workspace }}/qiml2026_fg_egcn/src
      OMP_NUM_THREADS: 2
      MKL_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install reproduction dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy pandas scikit-learn PyYAML
      - name: Download Elliptic
        run: python qiml2026_fg_egcn/scripts/fetch_elliptic.py
      - name: Verify dataset files
        run: |
          ls -lh data/raw/elliptic
          wc -l data/raw/elliptic/elliptic_txs_classes.csv
          wc -l data/raw/elliptic/elliptic_txs_edgelist.csv
          wc -l data/raw/elliptic/elliptic_txs_features.csv
      - name: Run seed-42 FG-EGCN reproduction
        run: python -m fg_egcn.cli --config qiml2026_fg_egcn/configs/paper.yaml
      - name: Compare with paper
        run: python qiml2026_fg_egcn/scripts/compare_to_paper.py outputs/fg_egcn_paper/result.json
      - name: Upload reproduction results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fg-egcn-reproduction-results
          path: |
            outputs/fg_egcn_paper/result.json
            outputs/fg_egcn_paper/history.json
            outputs/fg_egcn_paper/dataset_metadata.json
          if-no-files-found: warn

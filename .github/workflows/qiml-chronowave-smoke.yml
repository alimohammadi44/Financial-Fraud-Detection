name: QIML ChronoWave smoke

on:
  pull_request:
    paths:
      - 'qiml2026_chronowave/**'
      - '.github/workflows/qiml-chronowave-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install torch-geometric numpy pandas scikit-learn PyYAML pytest
      - name: Compile package
        run: python -m compileall -q qiml2026_chronowave/src
      - name: Run unit and PyG smoke tests
        env:
          PYTHONPATH: ${{ github.workspace }}/qiml2026_chronowave/src
        run: pytest -q qiml2026_chronowave/tests
